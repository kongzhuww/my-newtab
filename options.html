<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>新标签页设置</title>
    <link rel="stylesheet" href="newtab.css" />
    <style>
      .opt { max-width: 1000px; margin: 32px auto; padding: 0 24px; }
      .opt-head { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
      .opt-head h1 { min-width: 0; flex: 1; margin: 0; font-size: 20px; }
      .fields-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
      .field { margin-bottom: 18px; }
      .field label { display: block; font-size: 13px; margin-bottom: 6px; }
      .field input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 13px; }
      .field .hint { margin-top: 6px; font-size: 11px; color: var(--dim); }
      .field .hint a { color: var(--sky); }
      .save { padding: 10px 18px; border-radius: 8px; border: 0; background: #38bdf8; color: #08121a; font-weight: 700; cursor: pointer; }
      .save:hover { background: #7dd3fc; }
      .save.secondary { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
      .save.secondary:hover { border-color: var(--border-strong); background: var(--surface-hover); }
      .save-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      #saved { color: #34d399; font-size: 13px; }
      #saved.error { color: #fb7185; }
      .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 22px; color: var(--muted); font-size: 13px; text-decoration: none; }
      .back:hover { color: var(--heading); }
      .module-toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
      .toggle-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
      .toggle-card span { font-size: 13px; color: var(--text); }
      .toggle-card input { width: 18px; height: 18px; accent-color: #34d399; }
    </style>
  </head>
  <body>
    <form id="options-form" class="opt">
      <a class="back" href="newtab.html">← 返回新标签页</a>
      <div class="opt-head">
        <h1>新标签页设置</h1>
        <button id="save-return" class="save" type="button">保存并返回</button>
      </div>
      <p class="muted small">B站收藏夹用你浏览器里的登录态,无需在这里填。所有配置只存本地。</p>


      <div class="field">
        <label>首页模块显示</label>
        <div class="module-toggles">
          <label class="toggle-card"><span>天气模块</span><input id="showWeather" type="checkbox" /></label>
          <label class="toggle-card"><span>常用网站</span><input id="showSites" type="checkbox" /></label>
          <label class="toggle-card"><span>B站收藏夹</span><input id="showBili" type="checkbox" /></label>
          <label class="toggle-card"><span>今日待办</span><input id="showTodo" type="checkbox" /></label>
          <label class="toggle-card"><span>浏览器书签侧栏</span><input id="showBookmarkPanel" type="checkbox" /></label>
        </div>
        <p class="hint">关闭后首页会隐藏对应模块，并跳过该模块的数据加载。</p>
      </div>

      <div class="fields-grid">
        <div class="field">
          <label>城市（天气）</label>
          <input id="city" type="text" placeholder="如 武汉 / 北京 / Tokyo" />
          <p class="hint">用于天气与预报,留空则不显示天气。</p>
        </div>

        <div class="field">
          <label>Todoist API Token</label>
          <input id="todoistToken" type="password" placeholder="从 Todoist 设置 → 集成 → 开发者 复制" />
          <p class="hint">Todoist → Settings → Integrations → Developer → API token。<a href="https://app.todoist.com/app/settings/integrations/developer" target="_blank">打开</a></p>
        </div>

        <div class="field">
          <label>GitHub 用户名</label>
          <input id="ghUser" type="text" placeholder="如 octocat（你自己的用户名）" />
        </div>

        <div class="field">
          <label>GitHub Token（可选,私有仓库/更高频率）</label>
          <input id="ghToken" type="password" placeholder="ghp_...（留空则用公开接口）" />
          <p class="hint">只读即可:<a href="https://github.com/settings/tokens?type=beta" target="_blank">生成 token</a>（勾选 public/starred 读取权限）。</p>
        </div>

        <div class="field">
          <label>VPS 探针地址（可选）</label>
          <input id="vpsUrl" type="text" placeholder="https://logicweaver.me/vps/stats" />
          <p class="hint">返回 {load, cpu_count, mem, disk, uptime, hostname} 的 JSON 接口。留空则不显示探针。</p>
        </div>
      </div>

      <div class="save-actions">
        <button id="save" class="save secondary" type="submit">保存设置</button>
        <span id="saved" role="status"></span>
      </div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
