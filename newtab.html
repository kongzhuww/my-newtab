<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新标签页</title>
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="newtab.css" />
    <link rel="stylesheet" href="vendor/spine-player.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="tb-brand"><span class="tb-logo">LW</span><b>新标签页</b></div>
      <div class="tb-actions">
        <span id="tb-launchers"></span>
        <button id="theme-toggle" class="tb-btn" title="切换主题">🌙</button>
        <a href="options.html" class="tb-btn" title="设置">⚙</a>
      </div>
    </header>

    <section id="launcher" class="launcher" aria-label="快捷入口">
      <div class="launcher-toolbar">
        <button id="background-change" class="launcher-command" type="button" title="更换首屏背景">背景</button>
        <button id="background-reset" class="launcher-icon" type="button" title="恢复默认背景">↶</button>
        <button id="launcher-edit" class="launcher-command" type="button">编辑入口</button>
      </div>

      <div class="launcher-inner">
        <div class="hero-clock">
          <p id="greeting">你好</p>
          <p id="clock" class="clock">--:--<span id="secs">:--</span></p>
          <p id="date" class="date"></p>
        </div>

        <form id="search" class="search">
          <span class="s-icon" aria-hidden="true">⌕</span>
          <input id="search-input" placeholder="搜索，或输入网址直接打开" autocomplete="off" />
        </form>

        <div id="launcher-groups" class="launcher-groups">
          <section id="launcher-bili" class="launcher-group launcher-bili size-large">
            <header class="card-head">
              <span class="bar pink"></span>
              <h2>B站收藏夹</h2>
              <span class="grow"></span>
              <span id="bili-user" class="muted small"></span>
            </header>
            <div id="bili-body"><p class="muted small">加载中…</p></div>
          </section>
        </div>
        <div class="launcher-edit-actions">
          <button id="launcher-add" class="launcher-add" type="button">＋ 添加网站</button>
          <button id="bookmark-open" class="launcher-add" type="button">导入书签</button>
        </div>
      </div>

      <input id="background-input" type="file" accept="image/*" hidden />
    </section>

    <aside id="bookmark-panel" class="bookmark-panel" aria-label="浏览器书签">
      <section class="bookmark-panel-sheet">
        <header>
          <div>
            <h2>浏览器书签</h2>
            <p>拖到快捷入口分组，或点加号加入常用网站</p>
          </div>
          <button id="bookmark-close" type="button" title="收起">✕</button>
        </header>
        <input id="bookmark-search" class="bookmark-search" placeholder="搜索书签" autocomplete="off" />
        <div id="bookmark-import-list" class="bookmark-import-list"></div>
      </section>
      <button id="bookmark-handle" class="bookmark-handle" type="button" aria-expanded="false" title="展开浏览器书签">
        <span id="bookmark-handle-icon">📁</span>
        <span>书签</span>
      </button>
    </aside>

    <dialog id="launcher-dialog" class="launcher-dialog">
      <form id="launcher-form">
        <input id="launcher-id" type="hidden" />
        <h2 id="launcher-dialog-title">添加网站</h2>
        <label>
          名称
          <input id="launcher-title" maxlength="30" required autocomplete="off" />
        </label>
        <label>
          网址
          <input id="launcher-url" type="text" placeholder="https://example.com" required autocomplete="off" />
        </label>
        <label>
          分组
          <input id="launcher-group" maxlength="20" placeholder="常用网站" autocomplete="off" />
        </label>
        <div class="dialog-actions">
          <button id="launcher-delete" class="dialog-danger" type="button">删除</button>
          <span class="grow"></span>
          <button id="launcher-cancel" type="button">取消</button>
          <button class="dialog-primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="group-merge-dialog" class="launcher-dialog">
      <form id="group-merge-form">
        <h2>合并收藏夹</h2>
        <p id="group-merge-copy" class="dialog-copy"></p>
        <label>
          合并到
          <select id="group-merge-target" required></select>
        </label>
        <div class="dialog-actions">
          <span class="grow"></span>
          <button id="group-merge-cancel" type="button">取消</button>
          <button class="dialog-primary" type="submit">合并</button>
        </div>
      </form>
    </dialog>

    <div id="folder-menu-backdrop" class="folder-menu-backdrop" hidden></div>
    <div id="folder-menu" class="folder-menu" role="menu" hidden>
      <p id="folder-menu-title"></p>
      <button id="folder-menu-size" type="button"></button>
      <button id="folder-menu-merge" type="button">合并到其他收藏夹</button>
    </div>

    <dialog id="launcher-folder-dialog" class="launcher-dialog launcher-folder-dialog">
      <div class="launcher-folder-dialog-shell">
        <header>
          <h2 id="launcher-folder-dialog-title"></h2>
          <button id="launcher-folder-close" type="button" title="关闭">✕</button>
        </header>
        <div id="launcher-folder-dialog-items" class="launcher-folder-dialog-items"></div>
      </div>
    </dialog>

    <main class="wrap">
      <!-- Todoist -->
      <section class="card">
        <header class="card-head">
          <span class="bar sky"></span>
          <h2>今日待办</h2>
          <span class="grow"></span>
          <button id="todo-refresh" class="icon-btn" title="刷新">↻</button>
        </header>
        <div id="todo-body"><p class="muted small">加载中…</p></div>
      </section>

      <!-- Weather -->
      <section class="card">
        <header class="card-head">
          <span class="bar" style="background: linear-gradient(180deg,#38bdf8,#818cf8)"></span>
          <h2 id="wx-title">天气</h2>
        </header>
        <div id="weather-body"><p class="muted small">加载中…</p></div>
      </section>

      <!-- Heybox jump -->
      <section class="card">
        <header class="card-head">
          <span class="bar" style="background: linear-gradient(180deg,#f97316,#facc15)"></span>
          <h2>小黑盒收藏</h2>
        </header>
        <a class="heybox" href="https://www.xiaoheihe.cn/app/user/favour/content" target="_blank" rel="noreferrer">
          <span class="hb-icon">🎮</span>
          <span>
            <span class="hb-title">打开我的小黑盒收藏 ↗</span>
            <span class="hb-sub muted small">接口需签名、暂不内嵌，点此跳转收藏页</span>
          </span>
        </a>
      </section>

      <!-- VPS probe -->
      <section class="card wide">
        <header class="card-head">
          <span class="bar" style="background: linear-gradient(180deg,#22d3ee,#3b82f6)"></span>
          <h2>VPS 探针</h2>
          <span class="grow"></span>
          <span id="vps-host" class="dim small"></span>
        </header>
        <div id="vps-body"><p class="muted small">连接中…</p></div>
      </section>

      <!-- AI HOT -->
      <section class="card wide">
        <header class="card-head">
          <span class="bar" style="background: linear-gradient(180deg,#34d399,#38bdf8)"></span>
          <h2>AI HOT 热榜</h2>
          <span class="grow"></span>
          <button id="aihot-refresh" class="icon-btn" title="刷新">↻</button>
        </header>
        <div id="aihot-body"><p class="muted small">加载中…</p></div>
      </section>

      <!-- GitHub trending -->
      <section class="card wide">
        <header class="card-head">
          <span class="bar" style="background: linear-gradient(180deg,#f472b6,#a78bfa)"></span>
          <h2>GitHub 趋势</h2>
          <span class="grow"></span>
          <span id="trend-range" class="dim small">近 7 天</span>
        </header>
        <div id="trend-body"><p class="muted small">加载中…</p></div>
      </section>

      <!-- GitHub stars -->
      <section class="card wide">
        <header class="card-head">
          <span class="bar amber"></span>
          <h2>GitHub Star</h2>
          <span class="grow"></span>
          <span id="gh-user" class="muted small"></span>
        </header>
        <div id="gh-body"><p class="muted small">加载中…</p></div>
      </section>
    </main>
    <script src="newtab.js"></script>
    <script src="music.js"></script>
    <script src="kb.js"></script>
    <script src="vendor/spine-player.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
